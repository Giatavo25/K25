<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarjeta QR para imprimir</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: "IM Fell English", Georgia, serif; background: #eee; margin: 0; padding: 20px; color: #5b3d2e; }
    .panel { max-width: 560px; margin: 0 auto 20px; background: #fff; padding: 16px; border-radius: 10px; }
    .panel label { display: block; font-weight: bold; margin: 8px 0 4px; }
    .panel input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .panel button { margin-top: 12px; padding: 10px 18px; font-size: 16px; border: 0; border-radius: 6px; background: #8e1f2a; color: #fff; cursor: pointer; }
    .hoja { display: flex; flex-wrap: wrap; gap: 10mm; justify-content: center; }
    .tarjeta {
      width: 9cm; height: 9cm; box-sizing: border-box;
      background: radial-gradient(ellipse, #fbf1d8 55%, #ead3a0 100%); border: 1px dashed #b89a5c; box-shadow: inset 0 0 0 3mm #fbf1d8, inset 0 0 0 calc(3mm + 1.5px) #c9965a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 6mm;
    }
    .tarjeta h1 { font-family: "Cinzel Decorative", serif; font-weight: 700; font-size: 21px; margin: 0; color: #8e1f2a; }
    .tarjeta .sub { font-style: italic; font-size: 13px; margin: 2px 0 8px; }
    .regalo { font-size: 14px; letter-spacing: 6px; color: #c9965a; margin-bottom: 4px; }
    .marco { padding: 8px; border: 5px solid #8e1f2a; background: #fff; box-shadow: inset 0 0 0 2px #c9965a; }
    .qr img, .qr canvas { width: 3.6cm !important; height: 3.6cm !important; display: block; }
    .pie { font-size: 12px; margin-top: 8px; }
    .cor { color: #d98c8c; font-size: 12px; }
    @media print {
      body { background: #fff; padding: 0; }
      .panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <label>1. Pega aquí el link de tu página (ej: https://tuusuario.github.io/cumple/)</label>
    <input id="url" placeholder="https://..." />
    <label>2. Título de la tarjeta</label>
    <input id="tit" value="Feliz Cumpleaños" />
    <label>3. Subtítulo</label>
    <input id="sub" value="Una lechuza dejó esto para ti" />
    <button onclick="generar()">Generar tarjeta</button>
    <button onclick="window.print()">Imprimir</button>
    <p style="font-size:14px">Consejo: imprime en cartulina o papel fotográfico mate y recórtala por la línea punteada. <b>Escanéala con tu teléfono antes de regalarla</b> para comprobar que abre la página.</p>
  </div>

  <div class="hoja">
    <div class="tarjeta">
      <h1 id="tTit">Feliz Cumpleaños</h1>
      <p class="sub" id="tSub">Una lechuza dejó esto para ti</p>
      <div class="regalo">✦ ✦ ✦</div>
      <div class="marco"><div id="qr" class="qr"></div></div>
      <p class="pie">Escanea y deja que la magia empiece</p>
      <div class="cor" style="color:#8e1f2a">K ♥</div>
    </div>
  </div>

  <script>
    function generar() {
      const url = document.getElementById("url").value.trim();
      document.getElementById("tTit").textContent = document.getElementById("tit").value;
      document.getElementById("tSub").textContent = document.getElementById("sub").value;
      const box = document.getElementById("qr");
      box.innerHTML = "";
      if (!url) { alert("Primero pega el link de tu página"); return; }
      new QRCode(box, { text: url, width: 400, height: 400, colorDark: "#2a1530", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
    }
  </script>
</body>
</html>
